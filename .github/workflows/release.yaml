name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: The tag is on main and names the version
      env:
        TAG: ${{ github.ref_name }}
      run: |
        git fetch origin main
        git merge-base --is-ancestor "$GITHUB_SHA" origin/main
        python scripts/check_release.py "$TAG"
    - name: Build the wheel and the sdist
      run: |
        python -m pip install build
        python -m build
    - name: Try the wheel in a clean venv
      run: |
        python -m venv "$RUNNER_TEMP/try"
        "$RUNNER_TEMP/try/bin/pip" install -r requirements/gemini.txt dist/*.whl
        cd "$RUNNER_TEMP"
        "$RUNNER_TEMP/try/bin/python" -m geomind --help
        "$RUNNER_TEMP/try/bin/python" -c "import geomind; print(geomind.__version__)"
    - name: Create the GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: gh release create "$TAG" dist/* --title "geomind ${TAG#v}" --generate-notes --verify-tag
