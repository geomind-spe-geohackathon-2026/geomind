message: Size the project's plant for its case, then optimise it.
plant: evals/projects/hackathon
# The design loop sets the case before a design lead runs; the case lead owns set_case.
setup:
- {tool: set_case, input: {source: project}}
criteria:
- kind: tool
  tool: read_plant
- kind: tool
  tool: build_plant
- kind: state
  path: /design/families
- kind: tool
  tool: size_plant
