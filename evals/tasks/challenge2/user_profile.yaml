# Hand-written recording (decisions by hand, every reference and number from the real tools); the live run replaces it.
message: 'Design a deep-geothermal heating and cooling plant for the project''s case: its 2027 daily heating
  and cooling demand, its reservoir and brine, and its constraints. Change one thing: my heating demand
