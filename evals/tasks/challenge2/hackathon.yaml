# Hand-written recording, every number from the real tools; the live run replaces it.
message: >-
  Design a deep-geothermal heating and cooling plant for the project's case: its 2027 daily heating
  and cooling demand, its reservoir and brine, and its constraints.
plant: evals/projects/hackathon
criteria:
- kind: tool
  tool: set_case
- kind: state
  path: /case/demand/heating/supply_temperature/value
  equals: 100
- kind: verified
  checks:
  - heat_users.unmet_demand
  - cool_users.unmet_sensible
  - d0.brine_cooling
  - d0.pump_efficiency
  - d0.volume_imbalance
  - heat_users.supply_in.temperature
  - cool_users.supply_in.temperature
